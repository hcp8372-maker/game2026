<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>115臺南社區福利成果嘉年華</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: linear-gradient(135deg, #f0fdf4 0%, #fef3c7 100%); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    header { background: #ffffff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10; }
    header h1 { margin: 0; font-size: 1.8rem; color: #166534; }
    .game-stats { display: flex; gap: 20px; font-size: 1.3rem; font-weight: bold; }
    .stat-box { background: #f3f4f6; padding: 6px 15px; border-radius: 12px; color: #1f2937; }
    .highlight { color: #dc2626; font-size: 1.5rem; }
    
    main { flex: 1; display: flex; flex-direction: row; width: 100%; }
    
    .left-panel { flex: 1; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #cbd5e1; position: relative; padding: 20px; }
    .wheel-container { position: relative; width: 420px; height: 420px; }
    canvas#wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
    .pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid #dc2626; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    
    .spin-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90px; height: 90px; background: #dc2626; color: #fff; font-size: 1.6rem; font-weight: bold; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 12; }
    .spin-btn.disabled { background: #9ca3af; cursor: not-allowed; }

    .right-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .quiz-card { background: #ffffff; width: 100%; max-width: 500px; min-height: 380px; border-radius: 20px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; }
    .quiz-state-empty { text-align: center; color: #6b7280; font-size: 1.6rem; font-weight: bold; margin: auto; }
    .quiz-state-active { display: none; }
    .category-badge { display: inline-block; padding: 5px 14px; font-size: 1.1rem; font-weight: bold; color: #fff; border-radius: 30px; margin-bottom: 12px; align-self: flex-start; }
    .question-text { font-size: 1.4rem; color: #1f2937; margin-bottom: 15px; line-height: 1.4; font-weight: bold; }
    .options-grid { display: flex; flex-direction: column; gap: 8px; }
    
    .option-btn { background: #f3f4f6; border: 2px solid #e5e7eb; border-radius: 10px; padding: 10px 14px; font-size: 1.1rem; color: #374151; font-weight: bold; cursor: pointer; text-align: left; }
    .option-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #fff; width: 90%; max-width: 480px; border-radius: 20px; padding: 25px; text-align: center; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 1.8rem; margin-bottom: 10px; color: #166534; }
    .final-score { font-size: 2.8rem; color: #ea580c; font-weight: bold; margin: 10px 0; }
    .restart-btn { background: #2563eb; color: #fff; border: none; padding: 12px 30px; font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 15px; width: 100%; }

    .admin-input { width: 100%; padding: 12px; font-size: 1.1rem; margin: 12px 0; border: 2px solid #cbd5e1; border-radius: 8px; }
    .admin-btn { padding: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: #16a34a; color: white; border: none; border-radius: 8px; width: 100%; margin-bottom: 8px; }

    /* 排行榜表格樣式 */
    .leaderboard-table { width: 100%; margin: 10px 0; text-align: left; border-collapse: collapse; font-size: 1rem; }
    .leaderboard-table th, .leaderboard-table td { padding: 8px; border-bottom: 1px solid #e5e7eb; }
    .leaderboard-table th { color: #166534; background: #f0fdf4; }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 8px; padding: 10px; }
      header h1 { font-size: 1.4rem; }
      .game-stats { gap: 10px; font-size: 1.1rem; width: 100%; justify-content: center; }
      main { flex-direction: column; }
      .left-panel { border-right: none; border-bottom: 2px dashed #cbd5e1; padding: 20px; }
      .wheel-container { width: 280px; height: 280px; }
      .spin-btn { width: 75px; height: 75px; font-size: 1.3rem; }
      .quiz-card { padding: 20px; min-height: auto; }
      .question-text { font-size: 1.15rem; }
      .option-btn { font-size: 1rem; padding: 10px; }
    }
  </style>
</head>
<body>

  <!-- 玩家輸入名字彈窗 -->
  <div class="modal-overlay active" id="nameModal">
    <div class="modal-card">
      <div class="modal-title">🌟 歡迎參加挑戰 🌟</div>
      <p style="color: #4b5563;">請輸入您的稱呼或姓名以開始遊戲：</p>
      <input type="text" id="playerNameInput" class="admin-input" placeholder="例如：臺南志工小美" maxlength="15">
      <button class="admin-btn" onclick="startGame()">開始闖關！</button>
    </div>
  </div>

  <header>
    <h1>🌟 臺南社福嘉年華</h1>
    <div class="game-stats">
      <div class="stat-box">玩家：<span id="displayName" style="color:#2563eb;">訪客</span></div>
      <div class="stat-box">得分：<span id="scoreDisplay" class="highlight">0</span></div>
      <div class="stat-box">次數：<span id="spinsDisplay" class="highlight">2</span></div>
    </div>
  </header>

  <main>
    <div class="left-panel">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="420" height="420"></canvas>
        <div class="spin-btn" id="spinBtn">轉！</div>
      </div>
    </div>

    <div class="right-panel" id="quizSection">
      <div class="quiz-card">
        <div class="quiz-state-empty" id="quizEmptyState">👈 請點擊轉盤「轉！」<br>開始回答挑戰</div>
        <div class="quiz-state-active" id="quizActiveState">
          <div class="category-badge" id="qCategory">主題</div>
          <div class="question-text" id="qText">題目載入中...</div>
          <div class="options-grid" id="qOptions"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 遊戲結束結算與排行榜彈窗 -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-card">
      <div class="modal-title">🎉 挑戰結算 🎉</div>
      <div style="font-size: 1.1rem; color: #4b5563;">玩家：<strong id="finalPlayerName"></strong></div>
      <div class="final-score"><span id="finalScoreDisplay">0</span> / 2 分</div>
      
      <h3 style="margin: 12px 0 6px 0; color: #166534; text-align: left; font-size: 1.1rem;">🏆 本機英雄排行榜 (TOP 5)</h3>
      <table class="leaderboard-table" id="leaderboardTable">
        <tr><th>排名</th><th>玩家</th><th>得分</th></tr>
      </table>

      <button class="restart-btn" onclick="location.reload()">下一位玩家挑戰</button>
    </div>
  </div>

  <script>
    let playerName = "";
    function startGame() {
      const input = document.getElementById("playerNameInput").value.trim();
      if (!input) { alert("請輸入您的名字！"); return; }
      playerName = input;
      document.getElementById("displayName").innerText = playerName;
      document.getElementById("nameModal").classList.remove("active");
    }

    // 音效系統
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function playTick() { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05); }
    function playWin() { if (!audioCtx) return; const notes = [523.25, 659.25, 783.99, 1046.50]; notes.forEach((f, i) => { const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.value = f; const t = audioCtx.currentTime + i * 0.1; g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.3); osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3); }); }
    function playLose() { if (!audioCtx) return; const notes = [300, 250]; notes.forEach((f, i) => { const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.value = f; const t = audioCtx.currentTime + i * 0.2; g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.25); osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.25); }); }

    // 從 CSV 解析寫入的 8 道完整題庫
    const gameData = [
      {
        "label": "旗艦計畫",
        "color": "#f87171",
        "q": "請問衛福部社區旗艦計畫中將參與社區分為哪兩類？",
        "options": [
          "火車頭社區與火車廂社區",
          "飛機社區與飛船社區",
          "領航社區與協力社區",
          "太空社區與地球社區",
          "大船社區與小船社區"
        ],
        "ans": 2
      },
      {
        "label": "社區培力",
        "color": "#fb923c",
        "q": "請問當我們在推動社區發展工作遇到困難時，通常不會找誰？",
        "options": [
          "各公所承辦",
          "社會局人團科",
          "社區永續培力中心",
          "國家太空中心"
        ],
        "ans": 3
      },
      {
        "label": "福利服務",
        "color": "#facc15",
        "q": "請問以下何者是臺南的婦女福利服務中心？",
        "options": [
          "曾文婦女福利服務中心",
          "南瀛婦女福利服務中心",
          "玉井婦女福利服務中心",
          "永華婦女福利服務中心",
          "以上皆是"
        ],
        "ans": 4
      },
      {
        "label": "社區培力",
        "color": "#4ade80",
        "q": "請問下列何者不是臺南市社區永續培力中心的承辦單位？",
        "options": [
          "臺灣全球社會力永續發展協會",
          "國立臺南護理專科學校",
          "宇宙大聖人協會"
        ],
        "ans": 2
      },
      {
        "label": "社區會務",
        "color": "#38bdf8",
        "q": "請問下列何者「不」是社區發展協會每年必開的會議？",
        "options": [
          "會員大會",
          "理、監事會",
          "跨年演唱會"
        ],
        "ans": 2
      },
      {
        "label": "旗艦計畫",
        "color": "#818cf8",
        "q": "請問衛福部的大旗艦計畫執行期是幾年？",
        "options": [
          "1年",
          "2年",
          "3年",
          "4年",
          "5年"
        ],
        "ans": 2
      },
      {
        "label": "福利社區化",
        "color": "#c084fc",
        "q": "請問臺南市的「阮社區」計畫要向那個局處申請？",
        "options": [
          "都發局",
          "社會局",
          "衛生局",
          "環保局",
          "交通局"
        ],
        "ans": 1
      },
      {
        "label": "培力中心",
        "color": "#f472b6",
        "q": "請問臺南市社區永續培力中心（溪北區）的辦公室在？",
        "options": [
          "飛地創新育成中心",
          "高地創新育成中心",
          "濕地創新育成中心",
          "贏地創新育成中心",
          "輸地創新育成中心"
        ],
        "ans": 3
      }
    ];

    let currentScore = 0; 
    let spinsLeft = 2; 
    let isSpinning = false; 
    let isAnswering = false;
    let currentAngle = 0; 
    let lastTickSector = -1;
    let askedSectors = []; // 追蹤已回答過的題目索引，確保不重複

    const canvas = document.getElementById("wheelCanvas"); 
    const ctx = canvas.getContext("2d");

    function drawWheel() {
      const numSectors = gameData.length; 
      const arc = (2 * Math.PI) / numSectors; 
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath(); 
        // 如果該題已經回答過，扇形顏色變淡以示區隔
        ctx.fillStyle = askedSectors.includes(i) ? "#d1d5db" : (gameData[i].color || "#9ca3af"); 
        ctx.moveTo(radius, radius); 
        ctx.arc(radius, radius, radius - 10, angle, angle + arc); 
        ctx.lineTo(radius, radius); 
        ctx.fill();
        ctx.lineWidth = 3; 
        ctx.strokeStyle = "#ffffff"; 
        ctx.stroke();
        
        ctx.save(); 
        ctx.translate(radius, radius); 
        ctx.rotate(angle + arc / 2); 
        ctx.textAlign = "right"; 
        ctx.fillStyle = askedSectors.includes(i) ? "#9ca3af" : "#ffffff"; 
        ctx.font = "bold 20px PingFang TC, sans-serif"; 
        ctx.shadowColor = "rgba(0,0,0,0.3)"; 
        ctx.shadowBlur = 4; 
        ctx.fillText(gameData[i].label, radius - 35, 8); 
        ctx.restore();
      }
    }
    drawWheel();

    const spinBtn = document.getElementById("spinBtn");
    spinBtn.addEventListener("click", () => {
      initAudio();
      if (isSpinning || isAnswering || spinsLeft <= 0 || gameData.length === 0) return;
      
      isSpinning = true; 
      spinBtn.classList.add("disabled");
      document.getElementById("quizEmptyState").style.display = "block"; 
      document.getElementById("quizEmptyState").innerHTML = "🎡 輪盤轉動中..."; 
      document.getElementById("quizActiveState").style.display = "none";
      
      const numSectors = gameData.length; 
      const arc = (2 * Math.PI) / numSectors;
      
      // 確保抽到「尚未回答過」的題目索引
      let randomTargetSector;
      do {
        randomTargetSector = Math.floor(Math.random() * numSectors);
      } while (askedSectors.includes(randomTargetSector));

      const extraRounds = 5 + Math.floor(Math.random() * 3); 
      const targetAngle = (2 * Math.PI * extraRounds) + ((numSectors - randomTargetSector - 0.5) * arc) - (Math.PI / 2);
      const startAngle = currentAngle % (2 * Math.PI); 
      const totalDelta = targetAngle - startAngle;
      
      const duration = 3500; 
      let startTime = null; 
      lastTickSector = -1;

      function animateSpin(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime; 
        const progress = Math.min(elapsed / duration, 1);
        
        currentAngle = startAngle + totalDelta * (1 - Math.pow(1 - progress, 3)); 
        drawWheel();
        
        const normalizedAngle = (2 * Math.PI - (currentAngle + Math.PI / 2) % (2 * Math.PI)) % (2 * Math.PI);
        const currentSectorIdx = Math.floor(normalizedAngle / arc);
        if (currentSectorIdx !== lastTickSector && elapsed > 50) { 
          playTick(); 
          lastTickSector = currentSectorIdx; 
        }

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else { 
          isSpinning = false; 
          spinsLeft--; 
          document.getElementById("spinsDisplay").innerText = spinsLeft; 
          
          // 記錄此題已回答過
          askedSectors.push(randomTargetSector);
          drawWheel(); // 更新轉盤顯示灰階已答過區塊

          showQuestion(randomTargetSector); 
        }
      }
      requestAnimationFrame(animateSpin);
    });

    function showQuestion(sectorIndex) {
      isAnswering = true; 
      const data = gameData[sectorIndex];
      
      document.getElementById("quizEmptyState").style.display = "none"; 
      document.getElementById("quizActiveState").style.display = "block";
      document.getElementById("qCategory").innerText = data.label; 
      document.getElementById("qCategory").style.backgroundColor = data.color;
      document.getElementById("qText").innerText = data.q;
      
      const optionsContainer = document.getElementById("qOptions"); 
      optionsContainer.innerHTML = "";
      
      data.options.forEach((opt, idx) => {
        const btn = document.createElement("button"); 
        btn.className = "option-btn"; 
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(btn, idx, data.ans); 
        optionsContainer.appendChild(btn);
      });

      if (window.innerWidth <= 768) {
        setTimeout(() => { document.getElementById("quizSection").scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
      }
    }

    function handleAnswer(clickedBtn, selectedIdx, correctIdx) {
      initAudio();
      const allBtns = document.querySelectorAll(".option-btn");
      allBtns.forEach(b => b.style.pointerEvents = "none");
      
      if (selectedIdx === correctIdx) { 
        clickedBtn.classList.add("correct"); 
        currentScore += 1; 
        document.getElementById("scoreDisplay").innerText = currentScore; 
        playWin(); 
      } else { 
        clickedBtn.classList.add("wrong"); 
        if (allBtns[correctIdx]) allBtns[correctIdx].classList.add("correct"); 
        playLose(); 
      }

      setTimeout(() => {
        isAnswering = false;
        if (window.innerWidth <= 768 && spinsLeft > 0) window.scrollTo({ top: 0, behavior: 'smooth' });

        if (spinsLeft > 0) { 
          document.getElementById("quizActiveState").style.display = "none"; 
          document.getElementById("quizEmptyState").style.display = "block"; 
          document.getElementById("quizEmptyState").innerHTML = "👈 請繼續點擊轉盤「轉！」"; 
          spinBtn.classList.remove("disabled"); 
        } else { 
          // 2次機會用完，儲存成績並顯示本機排行榜
          saveScoreAndShowLeaderboard();
        }
      }, 2000);
    }

    // 處理本機排行榜邏輯
    function saveScoreAndShowLeaderboard() {
      document.getElementById("finalPlayerName").innerText = playerName;
      document.getElementById("finalScoreDisplay").innerText = currentScore;

      // 讀取本機紀錄
      let leaderboard = JSON.parse(localStorage.getItem("tainan_social_leaderboard")) || [];
      
      // 加入當前成績
      leaderboard.push({ name: playerName, score: currentScore, time: new Date().toLocaleTimeString() });
      
      // 分數由高到低排序
      leaderboard.sort((a, b) => b.score - a.score);
      
      // 保留前 10 名
      leaderboard = leaderboard.slice(0, 10);
      
      // 寫回本機儲存
      localStorage.setItem("tainan_social_leaderboard", JSON.stringify(leaderboard));

      // 渲染 HTML 表格
      let tableHtml = "<tr><th>排名</th><th>玩家</th><th>得分</th></tr>";
      leaderboard.forEach((item, index) => {
        tableHtml += `<tr><td>第 ${index + 1} 名</td><td>${item.name}</td><td><strong>${item.score}</strong> 分</td></tr>`;
      });
      document.getElementById("leaderboardTable").innerHTML = tableHtml;

      // 顯示彈窗並播放音效
      document.getElementById("gameOverModal").classList.add("active");
      if (currentScore > 0) setTimeout(playWin, 300);
    }
  </script>
</body>
</html>
