<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臺灣全球社會力永續發展協會 - 8題幸運輪盤</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: linear-gradient(135deg, #f0fdf4 0%, #fef3c7 100%); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    /* 標題與字體放大為兩倍 */
    header { background: #ffffff; padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10; }
    header h1 { margin: 0; font-size: 3.6rem; color: #166534; font-weight: bold; }
    .game-stats { display: flex; gap: 30px; font-size: 2.6rem; font-weight: bold; }
    .stat-box { background: #f3f4f6; padding: 10px 25px; border-radius: 16px; color: #1f2937; }
    .highlight { color: #dc2626; font-size: 3rem; }
    
    main { flex: 1; display: flex; flex-direction: row; width: 100%; position: relative; }
    
    .left-panel { flex: 1; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #cbd5e1; position: relative; padding: 20px; }
    .wheel-container { position: relative; width: 500px; height: 500px; }
    canvas#wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
    .pointer { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 50px solid #dc2626; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    
    .spin-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; background: #dc2626; color: #fff; font-size: 3rem; font-weight: bold; border-radius: 50%; border: 8px solid #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 12; }
    .spin-btn.disabled { background: #9ca3af; cursor: not-allowed; }

    .right-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .quiz-card { background: #ffffff; width: 100%; max-width: 750px; min-height: 450px; border-radius: 24px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; }
    .quiz-state-empty { text-align: center; color: #6b7280; font-size: 3.2rem; font-weight: bold; margin: auto; line-height: 1.5; }
    .quiz-state-active { display: none; }
    .category-badge { display: inline-block; padding: 8px 24px; font-size: 2.2rem; font-weight: bold; color: #fff; border-radius: 40px; margin-bottom: 20px; align-self: flex-start; }
    .question-text { font-size: 2.8rem; color: #1f2937; margin-bottom: 25px; line-height: 1.4; font-weight: bold; }
    .options-grid { display: flex; flex-direction: column; gap: 16px; }
    
    .option-btn { background: #f3f4f6; border: 3px solid #e5e7eb; border-radius: 16px; padding: 20px 24px; font-size: 2.2rem; color: #374151; font-weight: bold; cursor: pointer; text-align: left; transition: background 0.2s; }
    .option-btn:active { background: #e5e7eb; }
    .option-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

    /* 答案說明區塊字體放大 */
    .explanation-box { display: none; margin-top: 25px; padding: 25px; background-color: #f0f9ff; border-left: 8px solid #0284c7; border-radius: 12px; color: #0369a1; font-size: 2.1rem; line-height: 1.6; }
    .next-btn { display: none; margin-top: 25px; width: 100%; padding: 20px; background-color: #16a34a; color: #ffffff; border: none; border-radius: 16px; font-size: 2.4rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .next-btn:active { background-color: #15803d; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #fff; width: 90%; max-width: 650px; border-radius: 28px; padding: 45px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
    .modal-title { font-size: 3.8rem; margin-bottom: 25px; color: #166534; font-weight: bold; }
    .final-banner { font-size: 3.4rem; color: #ea580c; font-weight: bold; margin: 30px 0; }
    .restart-btn { background: #2563eb; color: #fff; border: none; padding: 20px 40px; font-size: 2.4rem; font-weight: bold; border-radius: 20px; cursor: pointer; margin-top: 20px; width: 100%; }

    @media (max-width: 768px) {
      header { flex-direction: column; gap: 12px; padding: 15px; text-align: center; }
      header h1 { font-size: 2.2rem; }
      .game-stats { gap: 15px; font-size: 1.6rem; width: 100%; justify-content: center; }
      main { flex-direction: column; }
      .left-panel { border-right: none; border-bottom: 2px dashed #cbd5e1; padding: 20px; }
      .wheel-container { width: 320px; height: 320px; }
      .spin-btn { width: 85px; height: 85px; font-size: 2rem; }
      .quiz-card { padding: 25px; min-height: auto; }
      .question-text { font-size: 1.8rem; }
      .option-btn { font-size: 1.5rem; padding: 14px; }
      .category-badge { font-size: 1.5rem; }
      .explanation-box { font-size: 1.4rem; }
      .next-btn { font-size: 1.6rem; padding: 14px; }
      .modal-title { font-size: 2.4rem; }
      .final-banner { font-size: 2.2rem; }
      .restart-btn { font-size: 1.6rem; padding: 14px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>臺灣全球社會力永續發展協會</h1>
    <div class="game-stats">
      <div class="stat-box">剩餘次數：<span id="spinsDisplay" class="highlight">2</span></div>
    </div>
  </header>

  <main>
    <div class="left-panel">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
        <div class="spin-btn" id="spinBtn">轉！</div>
      </div>
    </div>

    <div class="right-panel" id="quizSection">
      <div class="quiz-card">
        <div class="quiz-state-empty" id="quizEmptyState">👈 請點擊轉盤「轉！」<br
