<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臺灣全球社會力永續發展協會 - 幸運輪盤</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: linear-gradient(135deg, #f0fdf4 0%, #fef3c7 100%); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    header { background: #ffffff; padding: 20px 35px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10; }
    header h1 { margin: 0; font-size: 2.7rem; color: #166534; font-weight: bold; }
    .game-stats { display: flex; gap: 25px; font-size: 2rem; font-weight: bold; }
    .stat-box { background: #f3f4f6; padding: 8px 20px; border-radius: 14px; color: #1f2937; }
    .highlight { color: #dc2626; font-size: 2.3rem; }
    
    main { flex: 1; display: flex; flex-direction: row; width: 100%; position: relative; }
    
    /* 左側轉盤區域：放大為原先 1.5 倍 (460px -> 690px) */
    .left-panel { flex: 1.2; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #cbd5e1; position: relative; padding: 20px; }
    .wheel-container { position: relative; width: 690px; height: 690px; }
    canvas#wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
    .pointer { position: absolute; top: -33px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 33px solid transparent; border-right: 33px solid transparent; border-top: 66px solid #dc2626; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    
    .spin-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 158px; height: 158px; background: #dc2626; color: #fff; font-size: 3.6rem; font-weight: bold; border-radius: 50%; border: 10px solid #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 12; }
    .spin-btn.disabled { background: #9ca3af; cursor: not-allowed; }

    /* 右側題目區域：縮小為原先 0.8 倍 */
    .right-panel { flex: 0.8; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .quiz-card { background: #ffffff; width: 100%; max-width: 600px; min-height: 420px; border-radius: 22px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; }
    .quiz-state-empty { text-align: center; color: #6b7280; font-size: 2rem; font-weight: bold; margin: auto; line-height: 1.5; }
    .quiz-state-active { display: none; }
    .category-badge { display: inline-block; padding: 5px 15px; font-size: 1.32rem; font-weight: bold; color: #fff; border-radius: 35px; margin-bottom: 14px; align-self: flex-start; }
    
    /* 題目文字 */
    .question-text { font-size: 1.68rem; color: #1f2937; margin-bottom: 16px; line-height: 1.4; font-weight: bold; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    
    /* 選項按鈕 */
    .option-btn { background: #f3f4f6; border: 2.5px solid #e5e7eb; border-radius: 12px; font-size: 1.32rem; color: #374151; font-weight: bold; cursor: pointer; text-align: left; padding: 12px 15px; transition: background 0.2s; }
    .option-btn:active { background: #e5e7eb; }
    .option-btn.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

    /* 說明區塊（已移除標題文字） */
    .explanation-box { display: none; margin-top: 16px; padding: 16px; background-color: #f0f9ff; border-left: 5px solid #0284c7; border-radius: 10px; color: #0369a1; font-size: 1.28rem; line-height: 1.5; }
    .next-btn { display: none; margin-top: 16px; width: 100%; padding: 14px; background-color: #16a34a; color: #ffffff; border: none; border-radius: 12px; font-size: 1.44rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .next-btn:active { background-color: #15803d; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #fff; width: 90%; max-width: 550px; border-radius: 24px; padding: 35px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
    .modal-title { font-size: 3rem; margin-bottom: 20px; color: #166534; font-weight: bold; }
    .final-banner { font-size: 2.5rem; color: #ea580c; font-weight: bold; margin: 25px 0; }
    .restart-btn { background: #2563eb; color: #fff; border: none; padding: 16px 30px; font-size: 1.8rem; font-weight: bold; border-radius: 16px; cursor: pointer; margin-top: 15px; width: 100%; }

    @media (max-width: 900px) {
      header { flex-direction: column; gap: 10px; padding: 12px; text-align: center; }
      header h1 { font-size: 1.8rem; }
      .game-stats { gap: 12px; font-size: 1.3rem; width: 100%; justify-content: center; }
      main { flex-direction: column; }
      .left-panel { border-right: none; border-bottom: 2px dashed #cbd5e1; padding: 15px; }
      .wheel-container { width: 360px; height: 360px; }
      .spin-btn { width: 85px; height: 85px; font-size: 2rem; }
      .quiz-card { padding: 20px; min-height: auto; }
      .question-text { font-size: 1.4rem; }
      .option-btn { font-size: 1.2rem; padding: 10px; }
      .category-badge { font-size: 1.1rem; }
      .explanation-box { font-size: 1.1rem; }
      .next-btn { font-size: 1.3rem; padding: 12px; }
      .modal-title { font-size: 2rem; }
      .final-banner { font-size: 1.8rem; }
      .restart-btn { font-size: 1.4rem; padding: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>臺灣全球社會力永續發展協會</h1>
    <div class="game-stats">
      <div class="stat-box">剩餘次數：<span id="spinsDisplay" class="highlight">2</span></div>
    </div>
  </header>

  <main>
    <div class="left-panel">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="690" height="690"></canvas>
        <div class="spin-btn" id="spinBtn">轉！</div>
      </div>
    </div>

    <div class="right-panel" id="quizSection">
      <div class="quiz-card">
        <div class="quiz-state-empty" id="quizEmptyState">👈 請點擊轉盤「轉！」<br>開始回答挑戰</div>
        <div class="quiz-state-active" id="quizActiveState">
          <div class="category-badge" id="qCategory">主題</div>
          <div class="question-text" id="qText">題目載入中...</div>
          <div class="options-grid" id="qOptions"></div>
          
          <!-- 說明區塊 -->
          <div class="explanation-box" id="explanationBox">
            <span id="explanationText"></span>
          </div>
          <!-- 下一題按鈕 -->
          <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一題 ➔</button>
        </div>
      </div>
    </div>
  </main>

  <!-- 遊戲結束結算彈窗 -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-card">
      <div class="modal-title">🎉 挑戰完成 🎉</div>
      <div class="final-banner">遊戲結束～請抽獎～</div>
      <button class="restart-btn" onclick="location.reload()">下一位玩家挑戰</button>
    </div>
  </div>

  <script>
    // 音效系統
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function playTick() { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05); }
    function playWin() { if (!audioCtx) return; const notes = [523.25, 659.25, 783.99, 1046.50]; notes.forEach((f, i) => { const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.value = f; const t = audioCtx.currentTime + i * 0.1; g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.3); osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.3); }); }
    function playLose() { if (!audioCtx) return; const notes = [300, 250]; notes.forEach((f, i) => { const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.value = f; const t = audioCtx.currentTime + i * 0.2; g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.25); osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.25); }); }

    // 更新為上傳的最新題庫
    const gameData = [
      {
        "label": "贏地小秘密",
        "color": "#f87171",
        "q": "請問贏地創新育成基地有提供哪些創業相關服務？",
        "options": [
          "創業諮詢輔導",
          "開放式討論區",
          "團隊進駐空間",
          "以上皆是"
        ],
        "ans": 3,
        "explanation": "贏地創新育成基地提供臺南市新創團隊進駐空間申請、開放式討論區借用、創業諮詢輔導等多元創業輔導。聯絡方式：電話：06-6336777 電子郵件：winwin.tainan@gmail.com"
      },
      {
        "label": "贏地小秘密",
        "color": "#fb923c",
        "q": "請問贏地創新育成中心位在臺南哪一區？",
        "options": [
          "新營區",
          "舊營區",
          "上營區",
          "下營區"
        ],
        "ans": 0,
        "explanation": "臺南市創新育成基地位於臺南市新營區民治路38號，交通方便，停車也好停喔！"
      },
      {
        "label": "贏地小秘密",
        "color": "#facc15",
        "q": "請問贏地創新育成中心是隸屬於臺南市政府那個局處？",
        "options": [
          "經濟發展局",
          "交通局",
          "社會局",
          "衛生局"
        ],
        "ans": 0,
        "explanation": "贏地創新育成基地隸屬於臺南市經濟發展局，目前委託齊優空間股份有限公司管理。聯絡方式：電話：06-6336777 電子郵件：winwin.tainan@gmail.com"
      },
      {
        "label": "贏地小秘密",
        "color": "#4ade80",
        "q": "請問贏地創新育成中心目前是委託哪個單位管理？",
        "options": [
          "特優空間股份有限公司管理",
          "超優空間股份有限公司管理",
          "齊優空間股份有限公司管理"
        ],
        "ans": 2,
        "explanation": "贏地創新育成中心目前委託齊優空間股份有限公司管理。聯絡方式：電話：06-6336777 電子郵件：winwin.tainan@gmail.com"
      },
      {
        "label": "贏地小秘密",
        "color": "#38bdf8",
        "q": "請問本攤位是哪個單位？",
        "options": [
          "臺灣全球社會力永續展協會",
          "台灣宇宙社會力永續發展協會",
          "台灣在地社會力永續發展協會"
        ],
        "ans": 0,
        "explanation": "臺灣全球社會力永續發展協會於112年11月立案，致力於社會發展與培力。單位透過推行研究計畫、編譯書籍、深化地方文化，並與各級政府機構及國內外單位合作，辦理社區營造、地方創生、福利照顧等社會服務方案、研習與諮詢，推動實務交流與跨界協作。"
      }
    ];

    let currentScore = 0; 
    let spinsLeft = 2; 
    let isSpinning = false; 
    let isAnswering = false;
    let currentAngle = 0; 
    let lastTickSector = -1;
    let askedSectors = []; 

    const canvas = document.getElementById("wheelCanvas"); 
    const ctx = canvas.getContext("2d");

    // 繪製輪盤
    function drawWheel() {
      const numSectors = gameData.length; 
      const arc = (2 * Math.PI) / numSectors; 
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < numSectors; i++) {
        const angle = currentAngle + i * arc;
        
        ctx.beginPath(); 
        ctx.fillStyle = askedSectors.includes(i) ? "#d1d5db" : (gameData[i].color || "#9ca3af"); 
        ctx.moveTo(radius, radius); 
        ctx.arc(radius, radius, radius - 15, angle, angle + arc); 
        ctx.lineTo(radius, radius); 
        ctx.fill();
        
        ctx.lineWidth = 4; 
        ctx.strokeStyle = "#ffffff"; 
        ctx.stroke();
        
        ctx.save(); 
        ctx.translate(radius, radius); 
        ctx.rotate(angle + arc / 2); 
        ctx.textAlign = "right"; 
        ctx.fillStyle = askedSectors.includes(i) ? "#6b7280" : "#ffffff"; 
        ctx.font = "bold 33px PingFang TC, Microsoft JhengHei, sans-serif"; 
        ctx.shadowColor = "rgba(0,0,0,0.3)"; 
        ctx.shadowBlur = 4; 
        ctx.fillText(gameData[i].label, radius - 50, 12); 
        ctx.restore();
      }
    }

    window.onload = function() {
      drawWheel();
    };

    const spinBtn = document.getElementById("spinBtn");
    spinBtn.addEventListener("click", () => {
      initAudio();
      if (isSpinning || isAnswering || spinsLeft <= 0 || gameData.length === 0) return;
      
      isSpinning = true; 
      spinBtn.classList.add("disabled");
      document.getElementById("quizEmptyState").style.display = "block"; 
      document.getElementById("quizEmptyState").innerHTML = "🎡 輪盤轉動中..."; 
      document.getElementById("quizActiveState").style.display = "none";
      
      document.getElementById("explanationBox").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      const numSectors = gameData.length; 
      const arc = (2 * Math.PI) / numSectors;
      
      let randomTargetSector;
      do {
        randomTargetSector = Math.floor(Math.random() * numSectors);
      } while (askedSectors.includes(randomTargetSector));

      const extraRounds = 5 + Math.floor(Math.random() * 3); 
      const targetAngle = (2 * Math.PI * extraRounds) + ((numSectors - randomTargetSector - 0.5) * arc) - (Math.PI / 2);
      const startAngle = currentAngle % (2 * Math.PI); 
      const totalDelta = targetAngle - startAngle;
      
      const duration = 3500; 
      let startTime = null; 
      lastTickSector = -1;

      function animateSpin(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime; 
        const progress = Math.min(elapsed / duration, 1);
        
        currentAngle = startAngle + totalDelta * (1 - Math.pow(1 - progress, 3)); 
        drawWheel();
        
        const normalizedAngle = (2 * Math.PI - (currentAngle + Math.PI / 2) % (2 * Math.PI)) % (2 * Math.PI);
        const currentSectorIdx = Math.floor(normalizedAngle / arc);
        if (currentSectorIdx !== lastTickSector && elapsed > 50) { 
          playTick(); 
          lastTickSector = currentSectorIdx; 
        }

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else { 
          isSpinning = false; 
          spinsLeft--; 
          document.getElementById("spinsDisplay").innerText = spinsLeft; 
          
          askedSectors.push(randomTargetSector);
          drawWheel(); 

          showQuestion(randomTargetSector); 
        }
      }
      requestAnimationFrame(animateSpin);
    });

    function showQuestion(sectorIndex) {
      isAnswering = true; 
      const data = gameData[sectorIndex];
      
      document.getElementById("quizEmptyState").style.display = "none"; 
      document.getElementById("quizActiveState").style.display = "block";
      document.getElementById("qCategory").innerText = data.label; 
      document.getElementById("qCategory").style.backgroundColor = data.color;
      document.getElementById("qText").innerText = data.q;
      
      document.getElementById("explanationText").innerText = data.explanation || "無說明";
      document.getElementById("explanationBox").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      const optionsContainer = document.getElementById("qOptions"); 
      optionsContainer.innerHTML = "";
      
      data.options.forEach((opt, idx) => {
        const btn = document.createElement("button"); 
        btn.className = "option-btn"; 
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(btn, idx, data.ans); 
        optionsContainer.appendChild(btn);
      });

      if (window.innerWidth <= 900) {
        setTimeout(() => { document.getElementById("quizSection").scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
      }
    }

    function handleAnswer(clickedBtn, selectedIdx, correctIdx) {
      initAudio();
      const allBtns = document.querySelectorAll(".option-btn");
      allBtns.forEach(b => b.style.pointerEvents = "none");
      
      if (selectedIdx === correctIdx) { 
        clickedBtn.classList.add("correct"); 
        currentScore += 1; 
        playWin(); 
      } else { 
        clickedBtn.classList.add("wrong"); 
        if (allBtns[correctIdx]) allBtns[correctIdx].classList.add("correct"); 
        playLose(); 
      }

      document.getElementById("explanationBox").style.display = "block";
      document.getElementById("nextBtn").style.display = "block";

      if (window.innerWidth <= 900) {
        setTimeout(() => { document.getElementById("nextBtn").scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 200);
      }
    }

    function nextQuestion() {
      isAnswering = false;
      if (window.innerWidth <= 900) window.scrollTo({ top: 0, behavior: 'smooth' });

      if (spinsLeft > 0) { 
        document.getElementById("quizActiveState").style.display = "none"; 
        document.getElementById("quizEmptyState").style.display = "block"; 
        document.getElementById("quizEmptyState").innerHTML = "👈 請繼續點擊轉盤「轉！」"; 
        spinBtn.classList.remove("disabled"); 
      } else { 
        document.getElementById("gameOverModal").classList.add("active");
        setTimeout(playWin, 300);
      }
    }
  </script>
</body>
</html>
